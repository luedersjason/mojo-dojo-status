<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mojo Dojo — shop content</title>
  <link rel="icon" type="image/png" sizes="32x32" href="public/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="public/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="ribbon">
    <a class="brand" href="#" id="brand-home">
      <img class="brand-mark" src="public/brand/maker-mark-light.png" width="32" height="32" alt="" />
      <span class="brand-text">
        <span class="brand-name">Mojo Dojo</span>
        <span class="brand-sub">shop content</span>
      </span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <button type="button" id="nav-about">About</button>
      <a id="nav-discord" href="#" target="_blank" rel="noopener">Discord</a>
      <a id="nav-channel" href="https://www.youtube.com/@Mojowerkin" target="_blank" rel="noopener">Channel</a>
    </nav>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="Pipeline">
      <div class="sidebar-section pipeline">
        <div class="section-head">Pipeline</div>
        <ul class="topic-list" id="topic-list"></ul>
      </div>
      <div class="sidebar-section published">
        <div class="section-head">Published</div>
        <ul class="published-list" id="published-list"></ul>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
